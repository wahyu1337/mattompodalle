<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Galeri Foto dan Dokumentasi Kegiatan Pemerintahan dan Masyarakat Kelurahan Mattompodalle, Kecamatan Polongbangkeng Utara, Kabupaten Takalar.">
    <title>Galeri Dokumentasi — Kelurahan Mattompodalle</title>
</head>

<body>
    <!-- Site Header Container (Injected by header.js) -->
    <div id="site-header"></div>

    <main class="page-main">
        <!-- Page Header Banner -->
        <header class="page-header">
            <div class="container">
                <nav class="breadcrumb" aria-label="Breadcrumb">
                    <a href="/">Beranda</a>
                    <span class="breadcrumb__separator">/</span>
                    <span>Galeri</span>
                </nav>
                <h1 class="page-header__title">Galeri Dokumentasi</h1>
                <p class="page-header__subtitle">
                    Kumpulan foto kegiatan pelayanan, bakti sosial, peringatan hari nasional, dan gotong royong warga Kelurahan Mattompodalle.
                </p>
            </div>
        </header>

        <!-- Gallery Grid Section -->
        <section class="section section--surface">
            <div class="container">
                <div class="section-header">
                    <span class="section-badge">Dokumentasi Visual</span>
                    <h2 class="section-title">Foto Kegiatan Kelurahan</h2>
                    <p class="section-subtitle">
                        Klik pada foto untuk melihat tampilan resolusi penuh melalui viewer lightbox.
                    </p>
                </div>

                <div class="gallery-grid" id="galeri-grid-container">
                    <!-- Hydrated dynamically from src/data/galeri.json -->
                </div>
            </div>
        </section>
    </main>

    <!-- Site Footer Container (Injected by footer.js) -->
    <div id="site-footer"></div>
</body>

</html>
